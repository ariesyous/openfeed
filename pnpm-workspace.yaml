# Keep transitive tools reproducible and outside the 24-hour release-age window.
overrides:
  brace-expansion: 5.0.9
  electron-to-chromium: 1.5.426
  magic-string: 1.3.1
onlyBuiltDependencies:
  - esbuild
# pnpm 11 equivalent of the existing esbuild-only build allowlist.
allowBuilds:
  esbuild: true
