name: Generate sourced feed

# Generation every three hours, as requested by the user. GitHub drops or delays many
# scheduled runs (about half of the old `17 */3` slots never ran), so the cron fires
# hourly and the gate below skips any scheduled run within 150 minutes of the last edition.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# A run can retry several times against its selected model; without this, an overlapping
# manual trigger would race with an in-flight run on the final git commit/push.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  # Manual runs always generate. A scheduled run generates only when the newest
  # published edition started at least 150 minutes ago: on-time :17 runs stay three
  # hours apart, and a start delayed by up to 30 minutes still lets the next slot run.
  # An empty or failed run never updates the manifest, so the next hourly slot retries.
  # The workflow-level concurrency group means a queued run reads main after the
  # previous run's push.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          sparse-checkout: public/data/manifest.json
          sparse-checkout-cone-mode: false

      - id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          node -e '
            // The newest edition, not the manifest time, which corrections also rewrite.
            const { batches } = JSON.parse(require("fs").readFileSync("public/data/manifest.json", "utf8"));
            const generatedAt = batches.map(batch => batch.generatedAt).sort().at(-1);
            const minutes = (Date.now() - Date.parse(generatedAt)) / 60000;
            const run = process.env.EVENT !== "schedule" || !(minutes < 150);
            console.log(`Latest edition ${generatedAt}, ${Math.round(minutes)} minutes ago; ${run ? "generating" : "skipping until 150 minutes"}.`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
          '

  generate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # At most two posts per request, twenty per edition, 32 total writer/reviewer attempts.
    # Generation has a shared two-hour budget, leaving time to publish and deploy.
    # Source intake has its own short timeouts and skips unavailable feeds.
    timeout-minutes: 130
    steps:
      # ref (not the default github.sha) so a run queued behind the `generate`
      # concurrency group checks out whatever landed while it waited, rather than a
      # stale commit that would otherwise conflict with its own push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EDITORIAL_AUDIT_DIR: artifacts
        run: pnpm generate

      # Bounded selected support only. Public-repository artifacts are not confidential.
      # data_written means local publisher writes, not a successful commit or deployment.
      # Upload failure blocks the subsequent publication commit and deploy dispatch.
      - name: Upload editorial support audit
        if: always() && (hashFiles('artifacts/editorial-audit.json') != '' || hashFiles('artifacts/editorial-review.json') != '')
        uses: actions/upload-artifact@v4
        with:
          name: editorial-support-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/editorial-audit.json
            artifacts/editorial-review.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data generator/state
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(feed): publish sourced edition ${GITHUB_RUN_ID}"
            git pull --rebase
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not trigger other workflows'
      # `on: push` events (GitHub's loop-prevention rule), so Deploy would otherwise
      # never see this commit. Dispatch it explicitly instead.
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
