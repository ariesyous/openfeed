name: Generate sourced feed

# Hourly generation enabled after successful live validation and user authorization.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model to generate against
        type: choice
        default: openrouter/free
        options:
          - openrouter/free
          - google/gemini-3.8-flash
          - deepseek/deepseek-v4.1-flash

permissions:
  contents: write
  actions: write

# A run can retry several times against its selected model; without this, an overlapping
# manual trigger would race with an in-flight run on the final git commit/push.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # At most four posts per request, twenty per edition, eight total provider attempts.
    # Generation has a shared 45-minute budget, leaving time to publish and deploy.
    # Source intake has its own short timeouts and skips unavailable feeds.
    timeout-minutes: 55
    steps:
      # ref (not the default github.sha) so a run queued behind the `generate`
      # concurrency group checks out whatever landed while it waited, rather than a
      # stale commit that would otherwise conflict with its own push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'deepseek/deepseek-v4.1-flash' }}
          EDITORIAL_AUDIT_DIR: artifacts
        run: pnpm generate

      # Bounded selected support only. Public-repository artifacts are not confidential.
      # data_written means local publisher writes, not a successful commit or deployment.
      # Upload failure blocks the subsequent publication commit and deploy dispatch.
      - name: Upload editorial support audit
        if: always() && hashFiles('artifacts/editorial-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: editorial-support-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/editorial-audit.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data generator/state
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(feed): publish sourced edition ${GITHUB_RUN_ID}"
            git pull --rebase
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not trigger other workflows'
      # `on: push` events (GitHub's loop-prevention rule), so Deploy would otherwise
      # never see this commit. Dispatch it explicitly instead.
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
